services:
  frontend:
    environment:
      - NODE_ENV=development
    command:
      [
        "sh",
        "-c",
        "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port 4173"
      ]
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

  backend:
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
      ]
    volumes:
      - ./apps/backend:/app
      - homelab_data:/var/lib/homelab

  caddy:
    ports:
      - "8080:80"
      - "8443:443"
