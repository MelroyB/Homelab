services:
  caddy:
    image: caddy:latest
    container_name: homelab-caddy-1
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - XDG_DATA_HOME=/homelab-data/state/caddy/data
      - XDG_CONFIG_HOME=/homelab-data/state/caddy/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /homelab-data/config/caddy /homelab-data/state/caddy/data /homelab-data/state/caddy/config
        if [ ! -f /homelab-data/config/caddy/Caddyfile ]; then
          cat > /homelab-data/config/caddy/Caddyfile <<'EOF'
        {
            admin off
            auto_https disable_redirects
        }

        :80 {
            encode gzip

            @api path /api/* /health/* /docs* /openapi.json
            reverse_proxy @api backend:8000

            reverse_proxy frontend:4173
        }
        EOF
        fi
        exec caddy run --config /homelab-data/config/caddy/Caddyfile --adapter caddyfile
    volumes:
      - homelab_data:/homelab-data
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    container_name: homelab-frontend-1
    image: ${FRONTEND_IMAGE:-melroy/homelab-control-frontend:latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    networks:
      - control
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const req=require('http').get('http://127.0.0.1:4173',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(3000,()=>{req.destroy();process.exit(1)});",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    container_name: homelab-backend-1
    image: ${BACKEND_IMAGE:-melroy/homelab-control-backend:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${API_LOG_LEVEL}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BACKUP_ENCRYPTION_ENABLED=${BACKUP_ENCRYPTION_ENABLED}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - DOCKER_HOST=${DOCKER_HOST}
    volumes:
      - homelab_data:/var/lib/homelab
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    networks:
      - control
      - infra
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: homelab-postgres-1
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/postgres
    volumes:
      - homelab_data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: homelab-redis-1
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    networks:
      - control
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homelab-socket-proxy-1
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
      - IMAGES=1
      - DISTRIBUTION=1
      - PING=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "grep -qiE ':[0]*947[[:space:]].*0A' /proc/net/tcp"]
      interval: 15s
      timeout: 3s
      retries: 10

  dnsmasq:
    image: andyshinn/dnsmasq:latest
    container_name: homelab-dnsmasq-1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /homelab-data/config/dnsmasq/runtime /homelab-data/state/dnsmasq
        if [ ! -f /homelab-data/config/dnsmasq/dnsmasq.conf ]; then
          cat > /homelab-data/config/dnsmasq/dnsmasq.conf <<'EOF'
        # Managed by Homelab control plane.
        # The backend writes overrides into /homelab-data/config/dnsmasq/runtime.
        no-resolv
        server=1.1.1.1
        server=1.0.0.1
        local=/homelab.local/
        domain=homelab.local
        expand-hosts
        bogus-priv
        cache-size=1000

        # DHCP scope for homelab LAN (adjust to your environment)
        dhcp-range=192.168.50.100,192.168.50.200,12h
        dhcp-option=option:router,192.168.50.1
        dhcp-authoritative
        dhcp-leasefile=/homelab-data/state/dnsmasq/dnsmasq.leases

        conf-dir=/homelab-data/config/dnsmasq/runtime,*.conf
        EOF
        fi
        if [ ! -f /homelab-data/config/dnsmasq/runtime/generated.conf ]; then
          : > /homelab-data/config/dnsmasq/runtime/generated.conf
        fi
        exec dnsmasq -k --conf-file=/homelab-data/config/dnsmasq/dnsmasq.conf
    volumes:
      - homelab_data:/homelab-data
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "67:67/udp"
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "pidof dnsmasq >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  bind9:
    image: internetsystemsconsortium/bind9:9.21
    container_name: homelab-bind9-1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /homelab-data/config/bind9/zones /homelab-data/state/bind9/cache
        if [ ! -f /homelab-data/config/bind9/named.conf ]; then
          cat > /homelab-data/config/bind9/named.conf <<'EOF'
        options {
            directory "/homelab-data/state/bind9/cache";
            recursion no;
            allow-query { any; };
            dnssec-validation auto;
            listen-on { any; };
            listen-on-v6 { any; };
        };

        zone "homelab.local" IN {
            type master;
            file "/homelab-data/config/bind9/zones/db.homelab.local";
        };
        EOF
        fi
        if [ ! -f /homelab-data/config/bind9/zones/db.homelab.local ]; then
          cat > /homelab-data/config/bind9/zones/db.homelab.local <<'EOF'
        $$TTL    3600
        @       IN      SOA     ns1.homelab.local. admin.homelab.local. (
                                2026031001 ; serial
                                3600       ; refresh
                                900        ; retry
                                1209600    ; expire
                                3600 )     ; minimum

        @       IN      NS      ns1.homelab.local.
        ns1     IN      A       192.168.50.2
        api     IN      A       192.168.50.10
        dashboard IN    A       192.168.50.10
        EOF
        fi
        exec named -g -c /homelab-data/config/bind9/named.conf
    volumes:
      - homelab_data:/homelab-data
    ports:
      - "1053:53/tcp"
      - "1053:53/udp"
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "named-checkconf /homelab-data/config/bind9/named.conf || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ntp:
    image: cturra/ntp:latest
    container_name: homelab-ntp-1
    restart: unless-stopped
    environment:
      - NTP_SERVERS=time.cloudflare.com,time.google.com
    ports:
      - "123:123/udp"
    cap_add:
      - SYS_TIME
    volumes:
      - homelab_data:/homelab-data
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep [n]tpd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mailserver:
    image: ${MAILSERVER_IMAGE:-ghcr.io/docker-mailserver/docker-mailserver:latest}
    container_name: homelab-mailserver-1
    hostname: ${MAIL_HOSTNAME:-mail}
    domainname: ${MAIL_DOMAIN:-example.com}
    restart: unless-stopped
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p \
          /homelab-data/config/mailserver \
          /homelab-data/state/mailserver/data \
          /homelab-data/state/mailserver/mail-state \
          /homelab-data/state/mailserver/mail-logs \
          /tmp/docker-mailserver
        if [ ! -f /homelab-data/config/mailserver/mailserver.env ]; then
          cat > /homelab-data/config/mailserver/mailserver.env <<'EOF'
        OVERRIDE_HOSTNAME=mail.example.com
        POSTMASTER_ADDRESS=postmaster@example.com
        ENABLE_IMAP=1
        ENABLE_POP3=0
        ENABLE_SUBMISSION=1
        ENABLE_SUBMISSIONS=1
        ENABLE_SMTPS=0
        SSL_TYPE=self-signed
        DKIM_SELECTOR=mail
        PERMIT_DOCKER=network
        ONE_DIR=1
        DMS_DEBUG=0
        RUNTIME_DMS_ACCOUNTS_PATH=/homelab-data/config/mailserver/postfix-accounts.cf
        RUNTIME_DMS_VIRTUAL_PATH=/homelab-data/config/mailserver/postfix-virtual.cf
        EOF
        fi
        if [ ! -f /homelab-data/config/mailserver/postfix-accounts.cf ]; then
          : > /homelab-data/config/mailserver/postfix-accounts.cf
        fi
        if [ ! -f /homelab-data/config/mailserver/postfix-virtual.cf ]; then
          : > /homelab-data/config/mailserver/postfix-virtual.cf
        fi
        set -a
        . /homelab-data/config/mailserver/mailserver.env
        set +a
        ln -sf "${RUNTIME_DMS_ACCOUNTS_PATH:-/homelab-data/config/mailserver/postfix-accounts.cf}" /tmp/docker-mailserver/postfix-accounts.cf
        ln -sf "${RUNTIME_DMS_VIRTUAL_PATH:-/homelab-data/config/mailserver/postfix-virtual.cf}" /tmp/docker-mailserver/postfix-virtual.cf
        rm -rf /var/mail /var/mail-state /var/log/mail
        ln -s /homelab-data/state/mailserver/data /var/mail
        ln -s /homelab-data/state/mailserver/mail-state /var/mail-state
        ln -s /homelab-data/state/mailserver/mail-logs /var/log/mail
        exec /usr/local/bin/start-mailserver.sh
    volumes:
      - homelab_data:/homelab-data
    ports:
      - "${MAIL_SMTP_PORT:-25}:25"
      - "${MAIL_SUBMISSION_PORT:-587}:587"
      - "${MAIL_IMAPS_PORT:-993}:993"
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD-SHELL", "postconf -h myhostname >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  webmail:
    image: ${WEBMAIL_IMAGE:-roundcube/roundcubemail:latest-apache}
    container_name: homelab-webmail-1
    restart: unless-stopped
    depends_on:
      mailserver:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /homelab-data/config/webmail /homelab-data/state/webmail
        if [ ! -f /homelab-data/config/webmail/webmail.env ]; then
          cat > /homelab-data/config/webmail/webmail.env <<'EOF'
        ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
        ROUNDCUBEMAIL_DEFAULT_PORT=143
        ROUNDCUBEMAIL_SMTP_SERVER=mailserver
        ROUNDCUBEMAIL_SMTP_PORT=587
        EOF
        fi
        set -a
        . /homelab-data/config/webmail/webmail.env
        set +a
        export ROUNDCUBEMAIL_DB_TYPE=sqlite
        export ROUNDCUBEMAIL_DB_NAME=/homelab-data/state/webmail/roundcube.sqlite
        exec /docker-entrypoint.sh apache2-foreground
    volumes:
      - homelab_data:/homelab-data
    ports:
      - "${WEBMAIL_HTTP_PORT:-8081}:80"
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  edge:
    driver: bridge
  control:
    driver: bridge
    internal: true
  infra:
    driver: bridge

volumes:
  homelab_data:
  redis_data:
