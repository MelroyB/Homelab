[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-control-backend"
version = "0.1.0"
description = "Homelab control plane backend API"
authors = [{ name = "Homelab Team" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.3",
  "uvicorn[standard]>=0.44.0",
  "alembic>=1.18.4",
  "sqlalchemy>=2.0.49",
  "psycopg[binary]>=3.3.3",
  "email-validator>=2.3.0",
  "pydantic-settings>=2.13.1",
  "passlib[argon2]>=1.7.4",
  "PyJWT>=2.12.1",
  "python-multipart>=0.0.26",
  "docker>=7.1.0",
  "jinja2>=3.1.6",
  "redis>=7.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "httpx>=0.28.1",
  "ruff>=0.15.10",
  "pytest-cov>=7.1.0"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "S101", "S104", "S106", "S701", "UP017"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
