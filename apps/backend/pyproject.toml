[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-control-backend"
version = "0.1.0"
description = "Homelab control plane backend API"
authors = [{ name = "Homelab Team" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.34.0",
  "alembic>=1.14.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.7.1",
  "passlib[argon2]>=1.7.4",
  "PyJWT>=2.10.1",
  "python-multipart>=0.0.20",
  "docker>=7.1.0",
  "jinja2>=3.1.5",
  "redis>=5.2.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "httpx>=0.28.1",
  "ruff>=0.8.6",
  "pytest-cov>=6.0.0"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "S101", "S104", "S106", "S701", "UP017"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
